<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>わたしの本棚メーカー</title>
    <meta name="description" content="テーマに沿って選んだ本を、1枚の画像にまとめて保存・共有できるウェブアプリ" />

    <!-- favicon（ブラウザのタブ・ブックマーク・ホーム画面のアイコン） -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- OGP（X・LINE などで URL を貼ったときのカード）。画像は絶対 URL で書く -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="わたしの本棚メーカー" />
    <meta property="og:title" content="わたしの本棚メーカー" />
    <meta property="og:description" content="テーマに沿って選んだ本を、1枚の画像にまとめて保存・共有できるウェブアプリ" />
    <meta property="og:url" content="https://chocotto518.github.io/my-bookshelf-maker/" />
    <meta property="og:image" content="https://chocotto518.github.io/my-bookshelf-maker/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
